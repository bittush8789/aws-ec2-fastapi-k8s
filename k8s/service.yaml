apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: fastapi-lab
  labels:
    app.kubernetes.io/name: fastapi-app
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: fastapi-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
